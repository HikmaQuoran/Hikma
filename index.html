<script>
// ==================== DATABASE ====================
let db;
const DB_NAME = 'SchoolDB';
const DB_VERSION = 3;

const stores = {
    teachers: { keyPath: 'id', autoIncrement: true },
    deptNames: { keyPath: 'id', autoIncrement: true },
    students: { keyPath: 'id', autoIncrement: true },
    classes: { keyPath: 'id', autoIncrement: true },
    attendance: { keyPath: 'id', autoIncrement: true },
    grades: { keyPath: 'id', autoIncrement: true }
};

const initDB = () => {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            const oldStores = Array.from(db.objectStoreNames);
            oldStores.forEach(store => db.deleteObjectStore(store));
            Object.keys(stores).forEach(store => {
                db.createObjectStore(store, stores[store]);
            });
        };
    });
};

const getAll = (store) => {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const os = tx.objectStore(store);
        const request = os.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
};

const add = (store, data) => {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const os = tx.objectStore(store);
        const request = os.add(data);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
};

const update = (store, data) => {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const os = tx.objectStore(store);
        const request = os.put(data);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
};

const remove = (store, id) => {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const os = tx.objectStore(store);
        const request = os.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
};

// ==================== CONFIG ====================
let currentSection = 'teachers';
let editingId = null;
let deleteId = null;
let currentData = [];
let allCache = {};

const sections = {
    teachers: {
        title: 'المدرسين',
        desc: 'إدارة بيانات المدرسين',
        icon: 'fa-chalkboard-teacher',
        fields: [
            { name: 'firstName', label: 'الاسم', type: 'text', required: true },
            { name: 'lastName', label: 'اللقب', type: 'text', required: true },
            { name: 'idCard', label: 'رقم بطاقة التعريف', type: 'text', required: true },
            { name: 'phone', label: 'رقم الهاتف', type: 'tel', required: true }
        ],
        tableCols: ['المعرف', 'الاسم', 'اللقب', 'رقم البطاقة', 'الهاتف', 'الإجراءات'],
        exportCols: ['المعرف', 'الاسم', 'اللقب', 'رقم البطاقة', 'الهاتف']
    },
    deptNames: {
        title: ' الأقسام',
        desc: 'إدارة أسماء الأقسام',
        icon: 'fa-list',
        fields: [
            { name: 'name', label: 'اسم القسم', type: 'text', required: true }
        ],
        tableCols: ['المعرف', 'اسم القسم', 'الإجراءات'],
        exportCols: ['المعرف', 'اسم القسم']
    },
    students: {
        title: 'الطلاب',
        desc: 'إدارة بيانات الطلاب',
        icon: 'fa-user-graduate',
        fields: [
            { name: 'uniqueId', label: 'المعرف الوحيد', type: 'number', required: true },
            { name: 'firstName', label: 'الاسم', type: 'text', required: true },
            { name: 'lastName', label: 'اللقب', type: 'text', required: true },
            { name: 'idCard', label: 'رقم بطاقة التعريف', type: 'text', required: true },
            { name: 'phone', label: 'رقم الهاتف', type: 'tel', required: true }
        ],
        tableCols: ['المعرف', 'المعرف الوحيد', 'الاسم', 'اللقب', 'رقم البطاقة', 'الهاتف', 'الإجراءات'],
        exportCols: ['المعرف', 'المعرف الوحيد', 'الاسم', 'اللقب', 'رقم البطاقة', 'الهاتف']
    },
    classes: {
        title: 'الأقسام',
        desc: 'إدارة الأقسام الدراسية',
        icon: 'fa-chalkboard',
        fields: [
            { name: 'deptNameId', label: 'اسم القسم', type: 'select', required: true, source: 'deptNames', displayField: 'name' },
            { name: 'studentId', label: 'اسم الطالب', type: 'select', required: true, source: 'students', displayField: 'firstName', displayField2: 'lastName' },
            { name: 'teacherId', label: 'اسم المدرس', type: 'select', required: true, source: 'teachers', displayField: 'firstName', displayField2: 'lastName' }
        ],
        tableCols: ['المعرف', 'القسم', 'الطالب', 'المدرس', 'الإجراءات'],
        exportCols: ['المعرف', 'القسم', 'الطالب', 'المدرس']
    },
    attendance: {
        title: 'الحضور',
        desc: 'تسجيل حضور الطلاب',
        icon: 'fa-clipboard-check',
        fields: [
            { name: 'date', label: 'التاريخ', type: 'date', required: true },
            { name: 'deptNameId', label: 'القسم', type: 'select', required: true, source: 'deptNames', displayField: 'name', filterStudents: true },
            { name: 'studentId', label: 'اسم الطالب', type: 'select', required: true, source: 'students', displayField: 'firstName', displayField2: 'lastName', dependsOn: 'deptNameId' },
            { name: 'present', label: 'الحضور', type: 'select', required: true, options: [{value: 'نعم', label: 'نعم'}, {value: 'لا', label: 'لا'}] }
        ],
        tableCols: ['المعرف', 'التاريخ', 'القسم', 'الطالب', 'الحضور', 'الإجراءات'],
        exportCols: ['المعرف', 'التاريخ', 'القسم', 'الطالب', 'الحضور']
    },
    grades: {
        title: 'التقييم',
        desc: 'تقييم أداء الطلاب',
        icon: 'fa-star',
        fields: [
            { name: 'date', label: 'التاريخ', type: 'date', required: true },
            { name: 'deptNameId', label: 'القسم', type: 'select', required: true, source: 'deptNames', displayField: 'name', filterStudents: true },
            { name: 'studentId', label: 'اسم الطالب', type: 'select', required: true, source: 'students', displayField: 'firstName', displayField2: 'lastName', dependsOn: 'deptNameId' },
            { name: 'subject', label: 'المادة', type: 'text', required: true },
            { name: 'score', label: 'العدد (النقطة)', type: 'number', required: true, min: 0, max: 20 }
        ],
        tableCols: ['المعرف', 'التاريخ', 'القسم', 'الطالب', 'المادة', 'النقطة', 'الإجراءات'],
        exportCols: ['المعرف', 'التاريخ', 'القسم', 'الطالب', 'المادة', 'النقطة']
    }
};

// ==================== RELATION HELPERS ====================
function getNameById(id, source, field1, field2) {
    if (!allCache[source]) return 'غير معروف';
    const item = allCache[source].find(x => String(x.id) === String(id));
    if (!item) return 'غير معروف';
    let result = item[field1] || '';
    if (field2) result += ' ' + (item[field2] || '');
    return result.trim() || 'غير معروف';
}

function buildSearchText(item) {
    if (currentSection === 'teachers' || currentSection === 'students') {
        const uniqueIdStr = currentSection === 'students' ? (item.uniqueId || '') : '';
        return `${uniqueIdStr} ${item.firstName || ''} ${item.lastName || ''} ${item.idCard || ''} ${item.phone || ''}`;
    } else if (currentSection === 'deptNames') {
        return item.name || '';
    } else if (currentSection === 'classes') {
        return `${getNameById(item.deptNameId, 'deptNames', 'name')} ${getNameById(item.studentId, 'students', 'firstName', 'lastName')} ${getNameById(item.teacherId, 'teachers', 'firstName', 'lastName')}`;
    } else if (currentSection === 'attendance') {
        return `${item.date || ''} ${getNameById(item.deptNameId, 'deptNames', 'name')} ${getNameById(item.studentId, 'students', 'firstName', 'lastName')} ${item.present || ''}`;
    } else if (currentSection === 'grades') {
        return `${item.date || ''} ${getNameById(item.deptNameId, 'deptNames', 'name')} ${getNameById(item.studentId, 'students', 'firstName', 'lastName')} ${item.subject || ''} ${item.score || ''}`;
    }
    return '';
}

// ==================== UI FUNCTIONS ====================
function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toast-icon');
    const msg = document.getElementById('toast-message');
    msg.textContent = message;
    icon.className = type === 'success' ? 'fas fa-check-circle text-green-400' : 'fas fa-exclamation-circle text-red-400';
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3000);
}

function showSection(section) {
    currentSection = section;
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    document.getElementById('btn-' + section).classList.add('active');
    document.getElementById('page-title').textContent = sections[section].title;
    document.getElementById('page-desc').textContent = sections[section].desc;
    document.getElementById('searchInput').value = '';
    loadData();
}

async function refreshCache() {
    allCache = {};
    const sources = ['teachers', 'deptNames', 'students', 'classes'];
    for (const s of sources) {
        allCache[s] = await getAll(s);
    }
}

async function loadData() {
    await refreshCache();
    currentData = await getAll(currentSection);
    document.getElementById('stat-total').textContent = currentData.length;
    renderTable(currentData);
}

function renderTable(data) {
    const thead = document.getElementById('table-head');
    const tbody = document.getElementById('table-body');
    const empty = document.getElementById('empty-state');
    const config = sections[currentSection];

    thead.innerHTML = '<tr>' + config.tableCols.map(col => `<th class="px-6 py-4 text-right text-sm font-semibold text-netral-950">${col}</th>`).join('') + '</tr>';

    if (data.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');

    tbody.innerHTML = data.map(item => {
        let cells = '';
        cells += `<td class="px-6 py-4 text-sm font-semiblod text-netral-950">#${item.id}</td>`;

        if (currentSection === 'teachers' || currentSection === 'students') {
            if (currentSection === 'students') {
                cells += `<td class="px-6 py-4 text-sm font-bold text-emerald-700 font-mono">${item.uniqueId || ''}</td>`;
            }
            cells += `<td class="px-6 py-4 text-sm font-semiblod text-sky-900">${item.firstName}</td>`;
            cells += `<td class="px-6 py-4 text-sm text-sky-900">${item.lastName}</td>`;
            cells += `<td class="px-6 py-4 text-sm text-sky-900 font-mono">${item.idCard}</td>`;
            cells += `<td class="px-6 py-4 text-sm text-sky-900">${item.phone}</td>`;
        } else if (currentSection === 'deptNames') {
            cells += `<td class="px-6 py-4 text-sm font-medium text-slate-800">${item.name}</td>`;
        } else if (currentSection === 'classes') {
            const deptName = getNameById(item.deptNameId, 'deptNames', 'name');
            const studentName = getNameById(item.studentId, 'students', 'firstName', 'lastName');
            const teacherName = getNameById(item.teacherId, 'teachers', 'firstName', 'lastName');
            cells += `<td class="px-6 py-4 text-sm text-sky-900">${deptName}</td>`;
            cells += `<td class="px-6 py-4 text-sm font-medium text-sky-900">${studentName}</td>`;
            cells += `<td class="px-6 py-4 text-sm font-medium text-sky-900">${teacherName}</td>`;
        } else if (currentSection === 'attendance') {
            const deptName = getNameById(item.deptNameId, 'deptNames', 'name');
            const studentName = getNameById(item.studentId, 'students', 'firstName', 'lastName');
            cells += `<td class="px-6 py-4 text-sm text-sky-900">${item.date}</td>`;
            cells += `<td class="px-6 py-4 text-sm text-sky-900">${deptName}</td>`;
            cells += `<td class="px-6 py-4 text-sm font-medium text-slate-800">${studentName}</td>`;
            cells += `<td class="px-6 py-4 text-sm"><span class="px-3 py-1 rounded-full text-xs font-medium ${item.present === 'نعم' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${item.present}</span></td>`;
        } else if (currentSection === 'grades') {
            const deptName = getNameById(item.deptNameId, 'deptNames', 'name');
            const studentName = getNameById(item.studentId, 'students', 'firstName', 'lastName');
            cells += `<td class="px-6 py-4 text-sm text-sky-900">${item.date}</td>`;
            cells += `<td class="px-6 py-4 text-sm text-sky-900">${deptName}</td>`;
            cells += `<td class="px-6 py-4 text-sm font-medium text-sky-900">${studentName}</td>`;
            cells += `<td class="px-6 py-4 text-sm text-sky-900">${item.subject}</td>`;
            cells += `<td class="px-6 py-4 text-sm font-bold ${item.score >= 10 ? 'text-green-600' : 'text-red-600'}">${item.score}/20</td>`;
        }

        cells += `<td class="px-6 py-4 text-sm no-print">
            <div class="flex gap-2">
                <button onclick="editItem(${item.id})" class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition-all flex items-center justify-center" title="تعديل">
                    <i class="fas fa-edit text-xs"></i>
                </button>
                <button onclick="deleteItem(${item.id})" class="w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition-all flex items-center justify-center" title="حذف">
                    <i class="fas fa-trash text-xs"></i>
                </button>
            </div>
        </td>`;

        return `<tr class="hover:bg-slate-50 transition-colors fade-in">${cells}</tr>`;
    }).join('');
}

// ==================== MODAL ====================
async function openModal(editItemData = null) {
    editingId = editItemData ? editItemData.id : null;
    document.getElementById('modal-title').textContent = editItemData ? 'تعديل' : 'إضافة جديد';
    document.getElementById('modal').classList.remove('hidden');

    const config = sections[currentSection];
    const body = document.getElementById('modal-body');
    body.innerHTML = '';

    for (const field of config.fields) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `<label class="block text-sm font-medium text-slate-700 mb-2">${field.label}${field.required ? ' <span class="text-red-500">*</span>' : ''}</label>`;

        let input;
        if (field.type === 'select' && field.source) {
            input = document.createElement('select');
            input.className = 'w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all bg-white';
            input.innerHTML = '<option value="">اختر...</option>';
            const items = allCache[field.source] || await getAll(field.source);
            items.forEach(item => {
                let label = item[field.displayField] || '';
                if (field.displayField2) label += ' ' + (item[field.displayField2] || '');
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = label.trim();
                input.appendChild(opt);
            });
        } else if (field.type === 'select' && field.options) {
            input = document.createElement('select');
            input.className = 'w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all bg-white';
            input.innerHTML = '<option value="">اختر...</option>';
            field.options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt.value;
                option.textContent = opt.label;
                input.appendChild(option);
            });
        } else {
            input = document.createElement('input');
            input.type = field.type;
            input.className = 'w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all';
            if (field.min !== undefined) input.min = field.min;
            if (field.max !== undefined) input.max = field.max;
        }

        input.name = field.name;
        input.id = 'field-' + field.name;
        if (field.required) input.required = true;

        if (editItemData && editItemData[field.name] !== undefined) {
            input.value = editItemData[field.name];
        }

        wrapper.appendChild(input);
        body.appendChild(wrapper);
    }

    // Setup dynamic filtering for attendance and grades
    if ((currentSection === 'attendance' || currentSection === 'grades') && document.getElementById('field-deptNameId')) {
        const deptSelect = document.getElementById('field-deptNameId');
        deptSelect.addEventListener('change', (e) => {
            filterStudentsByDept(e.target.value);
        });

        if (editItemData && editItemData.deptNameId) {
            filterStudentsByDept(editItemData.deptNameId);
        }
    }
}

function filterStudentsByDept(deptNameId) {
    if (!deptNameId) return;
    const classes = allCache['classes'] || [];
    const students = allCache['students'] || [];

    const relatedStudentIds = classes
        .filter(c => String(c.deptNameId) === String(deptNameId))
        .map(c => String(c.studentId));

    const studentSelect = document.getElementById('field-studentId');
    if (!studentSelect) return;

    const currentValue = studentSelect.value;
    studentSelect.innerHTML = '<option value="">اختر...</option>';

    const filtered = students.filter(s => relatedStudentIds.includes(String(s.id)));
    filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.firstName + ' ' + s.lastName;
        studentSelect.appendChild(opt);
    });

    // Restore value if editing
    if (editingId) {
        const item = currentData.find(x => x.id === editingId);
        if (item && item.studentId) {
            const exists = filtered.some(s => String(s.id) === String(item.studentId));
            if (exists) studentSelect.value = item.studentId;
        }
    }
}

function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    editingId = null;
}

async function saveData() {
    const config = sections[currentSection];
    const data = {};

    for (const field of config.fields) {
        const el = document.getElementById('field-' + field.name);
        if (field.required && !el.value.trim()) {
            showToast('يرجى ملء جميع الخانات المطلوبة', 'error');
            el.focus();
            return;
        }
        data[field.name] = field.type === 'number' ? parseFloat(el.value) : el.value;
    }

    try {
        if (editingId) {
            data.id = editingId;
            await update(currentSection, data);
            showToast('تم التحديث بنجاح');
        } else {
            await add(currentSection, data);
            showToast('تمت الإضافة بنجاح');
        }
        closeModal();
        loadData();
    } catch (e) {
        showToast('حدث خطأ: ' + e.message, 'error');
    }
}

// ==================== EDIT & DELETE ====================
async function editItem(id) {
    const item = currentData.find(x => x.id === id);
    if (item) openModal(item);
}

function deleteItem(id) {
    deleteId = id;
    document.getElementById('delete-modal').classList.remove('hidden');
}

function closeDeleteModal() {
    document.getElementById('delete-modal').classList.add('hidden');
    deleteId = null;
}

async function confirmDelete() {
    if (deleteId) {
        try {
            await remove(currentSection, deleteId);
            showToast('تم الحذف بنجاح');
            loadData();
        } catch (e) {
            showToast('حدث خطأ أثناء الحذف', 'error');
        }
    }
    closeDeleteModal();
}

// ==================== SEARCH ====================
async function searchData() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!query) {
        renderTable(currentData);
        return;
    }

    const filtered = currentData.filter(item => {
        const searchText = buildSearchText(item).toLowerCase();
        return searchText.includes(query);
    });
    renderTable(filtered);
}

// ==================== EXPORT ====================
function getExportData() {
    const config = sections[currentSection];
    return currentData.map(item => {
        const row = {};
        row['المعرف'] = item.id;

        if (currentSection === 'teachers' || currentSection === 'students') {
            if (currentSection === 'students') {
                row['المعرف الوحيد'] = item.uniqueId;
            }
            row['الاسم'] = item.firstName;
            row['اللقب'] = item.lastName;
            row['رقم البطاقة'] = item.idCard;
            row['الهاتف'] = item.phone;
        } else if (currentSection === 'deptNames') {
            row['اسم القسم'] = item.name;
        } else if (currentSection === 'classes') {
            row['القسم'] = getNameById(item.deptNameId, 'deptNames', 'name');
            row['الطالب'] = getNameById(item.studentId, 'students', 'firstName', 'lastName');
            row['المدرس'] = getNameById(item.teacherId, 'teachers', 'firstName', 'lastName');
        } else if (currentSection === 'attendance') {
            row['التاريخ'] = item.date;
            row['القسم'] = getNameById(item.deptNameId, 'deptNames', 'name');
            row['الطالب'] = getNameById(item.studentId, 'students', 'firstName', 'lastName');
            row['الحضور'] = item.present;
        } else if (currentSection === 'grades') {
            row['التاريخ'] = item.date;
            row['القسم'] = getNameById(item.deptNameId, 'deptNames', 'name');
            row['الطالب'] = getNameById(item.studentId, 'students', 'firstName', 'lastName');
            row['المادة'] = item.subject;
            row['النقطة'] = item.score;
        }
        return row;
    });
}

// ==================== PDF PREVIEW ====================
function previewPDF() {
    const originalTable = document.getElementById('data-table');
    const element = originalTable.cloneNode(true);
    
    // Supprimer la colonne Actions
    const rows = element.querySelectorAll('tr');
    rows.forEach(row => {
        const lastCell = row.lastElementChild;
        if (lastCell && lastCell.querySelector('button')) lastCell.remove();
    });

    // ========== FORCER NOIR ET BLANC PUREMENT ==========
    
    // 1. Nettoyer TOUTES les classes Tailwind du tableau et de ses enfants
    const allElements = element.querySelectorAll('*');
    allElements.forEach(el => {
        el.removeAttribute('class');
        // Forcer le style inline noir/blanc
        el.style.color = '#000000';
        el.style.backgroundColor = 'transparent';
    });

    // 2. Styles du tableau global
    element.style.width = '100%';
    element.style.borderCollapse = 'collapse';
    element.style.fontFamily = 'Arial, "DejaVu Sans", sans-serif';
    element.style.fontSize = '11px';
    element.style.direction = 'rtl';
    element.style.color = '#000000';
    element.style.backgroundColor = '#ffffff';

    // 3. En-têtes : fond gris clair, texte noir GRAS, bordures noires épaisses
    const headers = element.querySelectorAll('thead th');
    headers.forEach(th => {
        th.style.backgroundColor = '#e5e7eb'; // gris clair visible
        th.style.color = '#000000';
        th.style.border = '1.5px solid #000000';
        th.style.padding = '8px 10px';
        th.style.textAlign = 'right';
        th.style.fontWeight = 'bold';
        th.style.fontSize = '12px';
        th.style.whiteSpace = 'nowrap';
    });

    // 4. Cellules du corps : blanc, texte noir, bordures noires
    const allCells = element.querySelectorAll('tbody td, thead th');
    allCells.forEach(cell => {
        cell.style.border = '1px solid #000000';
        cell.style.padding = '6px 10px';
        cell.style.textAlign = 'right';
        cell.style.verticalAlign = 'middle';
        cell.style.color = '#000000';
        cell.style.backgroundColor = '#ffffff';
        cell.style.fontSize = '11px';
    });

    // 5. Lignes du tbody : fond blanc pur, texte noir
    const bodyRows = element.querySelectorAll('tbody tr');
    bodyRows.forEach(tr => {
        tr.style.backgroundColor = '#ffffff';
        tr.style.color = '#000000';
    });

    // 6. Supprimer les badges colorés et remplacer par texte noir simple
    const spans = element.querySelectorAll('span');
    spans.forEach(span => {
        const text = span.textContent;
        span.outerHTML = `<span style="color:#000000; font-size:11px; font-weight:normal;">${text}</span>`;
    });

    // 7. Forcer les liens et textes spéciaux en noir
    const links = element.querySelectorAll('a');
    links.forEach(a => {
        a.style.color = '#000000';
        a.style.textDecoration = 'none';
    });

    // ========== CONTENEUR DU PDF ==========
    const wrapper = document.createElement('div');
    wrapper.style.direction = 'rtl';
    wrapper.style.fontFamily = 'Arial, "DejaVu Sans", sans-serif';
    wrapper.style.padding = '15px';
    wrapper.style.backgroundColor = '#ffffff';
    wrapper.style.color = '#000000';

    // Titre
    const title = document.createElement('h2');
    title.textContent = sections[currentSection].title;
    title.style.cssText = 'text-align:center; font-size:20px; margin-bottom:4px; color:#000000; font-weight:bold;';
    wrapper.appendChild(title);

    // Association
    const assoc = document.createElement('p');
    assoc.textContent = 'جمعية المحاظة على القرآن الكريم و الأخلاق الفاضلة - مركز الحكمة';
    assoc.style.cssText = 'text-align:center; font-size:13px; color:#000000; margin-bottom:2px; font-weight:bold;';
    wrapper.appendChild(assoc);

    // Date
    const dateEl = document.createElement('p');
    const d = new Date().toLocaleDateString('fr-TN');
    dateEl.textContent = 'تاريخ التقرير : ' + d;
    dateEl.style.cssText = 'text-align:center; font-size:11px; color:#000000; margin-bottom:18px;';
    wrapper.appendChild(dateEl);

    wrapper.appendChild(element);

    // ========== GÉNÉRATION PDF ==========
    const opt = {
        margin: [12, 12],
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
            scale: 3, 
            useCORS: true, 
            logging: false,
            backgroundColor: '#ffffff'
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };

    html2pdf().set(opt).from(wrapper).toPdf().get('pdf').then(pdf => {
        const blob = pdf.output('blob');
        const blobUrl = URL.createObjectURL(blob);
        window.open(blobUrl, '_blank');
        showToast('تم فتح PDF في نافذة جديدة');
    }).catch(err => {
        showToast('حدث خطأ في إنشاء PDF: ' + err.message, 'error');
    });
}
// ==================== EXCEL ====================
function exportExcel() {
    const config = sections[currentSection];
    const exportData = getExportData();

    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, config.title);

    const wscols = config.exportCols.map(() => ({ wch: 20 }));
    ws['!cols'] = wscols;

    XLSX.writeFile(wb, `${config.title}_${new Date().toISOString().split('T')[0]}.xlsx`);
    showToast('تم تصدير Excel بنجاح');
}

window.onload = async () => {
    await initDB();
    showSection('teachers');
};
